  rationale: 'The 2026-11-11 facebook_group_book_promotion skill tells the agent to open the group composer in the browser and submit the post as the Page. The 2026-11-12 agent_browser_signin_safety skill, written after the Meta account locked following agent browser activity on Facebook and Instagram, forbids signing in to Facebook or Instagram in the agent browser and states a Facebook group book post goes to the user on their own device instead. Reading both files shows a direct contradiction, so a worker following the promotion skill would take the route the safety skill forbids and risk another lock. Window Meta runs kept failing, including froggy-instagram-daily-1 run 8e72c8ca-4214-4541-85d2-ae6b3228b788 and otto-raccoon-instagram-daily-2 run 3712f43b-c090-4485-b3ad-3909b46b048b. This update removes browser submission, keeps the audience check, the KDP Bookshelf Amazon link check, copy variation and live post verification, and hands a ready pack to the user. I read all 10 active learned skills and found no justified merge: the closest pair, sign-in safety and browser outage fallback, address distinct triggers with distinct first actions, as the 2026-11-14 audit already found. Other window signals need no new skill: the Pinterest and KDP sign-in blocks are already covered by agent_browser_signin_safety, the storage-full recurrence is already covered by workspace_storage_triage, and the deterministic recurring-failure candidates name objective-loop cadence with no reusable method.'
