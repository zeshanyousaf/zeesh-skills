  rationale: 'In the 2026-11-24 Lupa session (17:16 to 18:58Z) text-to-image kept putting a separate mouth inside the pink lips character across repeated prompt rewrites, the user said the character still was not right and that lips kept getting a mouth inside, then rebuked the agent at 17:24:31Z, and the session only recovered when the agent pivoted to editing the original image with one short prompt that kept the pink character exactly the same and made a single change, which preserved the character. No existing skill covers this: skill_search for image generation and character consistency returned only image-search, product shots and advertising, and generated_video_verification covers verifying finished video, not capping image prompt iteration. Locked-character image work recurs across this user''s series, so the same re-prompt loop will recur without a cap and a switch rule. Consolidation was checked across the 12 active learned skills and no merge was justified: sign-in safety, outage fallback and approval cards address distinct triggers with distinct first actions, the TikTok and YouTube limit amendments cover different platforms, and search console scope labeling and campaign budget two-reading verification are different domains. Other window signals need no proposal: the Pilat join is already forbidden by the paid clipping skip-list check, the DASGASD3M budget rule was published 2026-11-24 and is inside its measurement window, the Medium and FATHOMIX sign-out blocks are already covered by agent_browser_signin_safety and the social publishing verification rule, the Amazon KDP gate refusal was correct, and the deterministic handoff-suppression candidates concern objective-loop cadence with no reusable method.'
