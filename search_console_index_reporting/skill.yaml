  rationale: The assistant reported indexed pages as 195 then 92 (assistant-msg-3b9b33ce), the user said 62, and the assistant then conceded 62 is the sitemap view at 62 of 180 while 92 is property-wide including about 30 non-sitemap pages (assistant-msg-b4f53e38), drawing user rebukes at a6ad8dcb, da9a0eef and ab4e13cf. In the same window the assistant claimed to have seen emails when it had only seen user-sent screenshots (message:3ffdd0ff). The alignment synthesis already warns to read page totals from the Pages view rather than the Queries view, but no skill covers the sitemap versus property-wide scope mix or the screenshot versus inbox source claim, and skill_search for Search Console and SEO reporting plus connector_search for Search Console returned no matching skill or connector. This skill makes the scope and the source explicit before any number is quoted, which directly changes the next Zeexy and CozyTinyHome index report.
