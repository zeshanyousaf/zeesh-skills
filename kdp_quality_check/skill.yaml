  rationale: 'Ten active learned skills trigger consolidation. kdp_cover_qa and kdp_interior_qa share one gate (before upload or before calling a book clean), one KDP upload queue, and the same check-the-next-book-in-the-queue alternative. A book needs both checks before the same upload, so two separate skills split one gate and invite a partial check, as on 2026-11-04 when a spot check called the Christmas Edition clean and a full scan on 2026-11-05 found 5 duplicate questions and 5 mismatched illustrations. The merged skill keeps every rule from both files in one discoverable place and retires both superseded skills, cutting active learned skills from 10 to 9. Other overlaps were checked and left alone: agent_browser_signin_safety and browser_outage_fallback address distinct triggers (a sign-in challenge versus a platform-wide outage) with distinct first actions, so merging them would trade two specific rules for one vaguer one. New window signals were also checked and need no new skill: the Upwork and Content Rewards Cloudflare checks and the primewire google.com pause are already covered by agent_browser_signin_safety, the kdp-upload-queue failures are parked on the KDP AI-agent gate that skill already refuses, the media generate_image failures carry no reusable method detail, and the deterministic memory and relationships recurring-failure candidates concern objective-loop cadence with no reusable method.'
