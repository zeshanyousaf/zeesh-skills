  measurement:
    proxy_metric_id: objective_success_rate
    success_criterion: No run in the window asks the user to delete a master or an alternate version on a transient disk reading, and no master is deleted while parallel builds still hold the space. Every deletion request names a fresh reading taken after running builds finished.
    window_days: 30
  rationale: On 2026-11-12 the agent reported about 28MB free against a 113MB file and asked the user to delete about 2GB of alternate versions and a silent render, and the user approved and 4 files were deleted. On 2026-11-13 the agent reported the workspace full again and listed large masters for deletion, then corrected the report in the same morning because files were saving again and parallel builds had filled the space, so no deletion was needed. No existing skill covers this decision, as skill_search for disk and quota returned no matching skill, and the workspace notes cover only the temporary folder and remote storage limits. This skill adds a fresh reading at decision time, a transient versus persistent check, and a rule never to delete a master on a transient reading.
