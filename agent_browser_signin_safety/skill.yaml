  rationale: 'On 2026-11-12 the user Meta account locked after agent browser activity on Facebook and Instagram, with a group posts check on the night of 2026-11-11 and a reel check at 12:44 to 12:50 on 2026-11-12, and the lock at about 13:01. The diagnosis was that Meta treated access from the agent browser United States datacenter address while the user is in Pakistan as suspicious access, both Facebook and Instagram locked, and 10 schedules were paused with owner only phone recovery. The existing skill stops at a verification challenge but does not forbid signed in Meta browsing, so this update adds the Meta browser ban, the connector first route for reads and Page posts, the stop and pause rule on a lock, and a narrow precedence that covers browser sign in steps only and does not override the Page only identity rule. The connector is not used for group book posts because the Facebook connector group post goes out as the personal profile, the writing guide offers post create with a group id and no Page identity option, and the Page publishing guide covers posts on a Page itself and not posts in a group as a Page, so a group book post goes to the user on their own device instead. The social publishing website carve outs for a Facebook site Group post and an Instagram site delete are also hand to user steps and not agent browser sign ins. Other window signals were checked and not proposed: the KDP AI agent gate was correctly refused twice, the media generate image failures carry only tool names with no reusable method detail, and the deterministic handoff suppression candidates concern objective loop cadence with no reusable method.'
