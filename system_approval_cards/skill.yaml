  needs_review: false
  rationale: On 2026-10-24 the agent first told the user to pick an always-allow card option that does not exist, and the user corrected that only Allow and Deny appear. The same day the agent repeatedly promised that batching and queuing would end the cards, including promises that all remaining work was in one queue and that no card would come again, and then paused the Halloween scheduler to stop the cards, leaving 10 of 20 Halloween items unscheduled. Memory already records the Allow and Deny wording, but the agent kept making the stronger promise and then used a pause as the remedy, so a managed skill is needed to separate chat approval from a per-step system card, forbid the no-more-cards promise, and forbid pausing standing work only to stop cards. Skill search found no existing skill covering this distinction. The deterministic handoff-suppression and recurring-failure candidates were rejected as skill proposals because they concern objective-loop cadence and carry no failure detail naming a reusable method, and learned skills number only 5, below the 10-skill consolidation trigger.
