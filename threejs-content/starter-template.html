<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Three.js Starter — Zeesh Creatives</title>
<style>
  html, body { margin: 0; height: 100%; overflow: hidden; background: #0b1220; font-family: system-ui, sans-serif; }
  #app { position: fixed; inset: 0; }
  #hud {
    position: fixed; left: 16px; bottom: 16px; z-index: 10; color: #e8eefc;
    background: rgba(10, 16, 30, .55); border: 1px solid rgba(255,255,255,.14);
    border-radius: 12px; padding: 10px 14px; backdrop-filter: blur(6px);
    font-size: 14px; line-height: 1.45; max-width: 320px;
  }
  #hud b { color: #7dd3fc; }
  #loading {
    position: fixed; inset: 0; display: flex; align-items: center; justify-content: center;
    color: #e8eefc; background: #0b1220; z-index: 20; font-size: 16px; letter-spacing: .04em;
  }
</style>
<script type="importmap">
{ "imports": {
    "three": "https://unpkg.com/three@0.160.0/build/three.module.js",
    "three/addons/": "https://unpkg.com/three@0.160.0/examples/jsm/"
} }
</script>
</head>
<body>
<div id="app"></div>
<div id="hud"><b>Three.js Starter</b><br>Drag to orbit · Scroll to zoom · Click the shapes</div>
<div id="loading">Loading…</div>

<script type="module">
import * as THREE from 'three';
import { OrbitControls } from 'three/addons/controls/OrbitControls.js';
import { RoomEnvironment } from 'three/addons/environments/RoomEnvironment.js';

// --- Renderer / Scene / Camera -------------------------------------------
const container = document.getElementById('app');
const renderer = new THREE.WebGLRenderer({ antialias: true });
renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
renderer.setSize(window.innerWidth, window.innerHeight);
renderer.outputColorSpace = THREE.SRGBColorSpace;
renderer.toneMapping = THREE.ACESFilmicToneMapping;
renderer.shadowMap.enabled = true;
renderer.shadowMap.type = THREE.PCFSoftShadowMap;
container.appendChild(renderer.domElement);

const scene = new THREE.Scene();
scene.background = new THREE.Color(0x0b1220);
scene.fog = new THREE.Fog(0x0b1220, 18, 40);

const pmrem = new THREE.PMREMGenerator(renderer);
scene.environment = pmrem.fromScene(new RoomEnvironment(), 0.04).texture;

const camera = new THREE.PerspectiveCamera(50, window.innerWidth / window.innerHeight, 0.1, 100);
camera.position.set(6, 4.5, 8);

const controls = new OrbitControls(camera, renderer.domElement);
controls.enableDamping = true;
controls.dampingFactor = 0.06;
controls.maxDistance = 20;
controls.minDistance = 3;
controls.maxPolarAngle = Math.PI * 0.49;
controls.autoRotate = true;
controls.autoRotateSpeed = 0.8;
controls.addEventListener('start', () => { controls.autoRotate = false; });

// --- Lights ---------------------------------------------------------------
const key = new THREE.DirectionalLight(0xffffff, 2.2);
key.position.set(6, 10, 4);
key.castShadow = true;
key.shadow.mapSize.set(2048, 2048);
key.shadow.camera.left = -8; key.shadow.camera.right = 8;
key.shadow.camera.top = 8; key.shadow.camera.bottom = -8;
scene.add(key);
scene.add(new THREE.HemisphereLight(0xbdd7ff, 0x1a2436, 0.5));

// --- Ground ---------------------------------------------------------------
const ground = new THREE.Mesh(
  new THREE.CircleGeometry(14, 64),
  new THREE.MeshStandardMaterial({ color: 0x14213a, roughness: 0.95, metalness: 0 })
);
ground.rotation.x = -Math.PI / 2;
ground.receiveShadow = true;
scene.add(ground);

// --- Demo subject: three shapes (replace with the real scene) -------------
const interactive = [];
function addShape(geometry, color, x, z) {
  const mesh = new THREE.Mesh(geometry, new THREE.MeshStandardMaterial({
    color, roughness: 0.35, metalness: 0.1
  }));
  mesh.position.set(x, 1, z);
  mesh.castShadow = true;
  mesh.userData.baseY = 1;
  mesh.userData.spin = 0.4 + Math.random() * 0.4;
  scene.add(mesh);
  interactive.push(mesh);
  return mesh;
}
addShape(new THREE.TorusKnotGeometry(0.85, 0.28, 160, 24), 0x38bdf8, 0, 0);
addShape(new THREE.IcosahedronGeometry(0.8, 0), 0xf59e0b, -3.2, -1.2);
addShape(new THREE.ConeGeometry(0.8, 1.7, 40), 0x34d399, 3.1, -0.8);

// --- Interaction: click a shape to bounce it ------------------------------
const raycaster = new THREE.Raycaster();
const pointer = new THREE.Vector2();
let hovered = null;
const bounces = new Map();

function setPointer(e) {
  pointer.x = (e.clientX / window.innerWidth) * 2 - 1;
  pointer.y = -(e.clientY / window.innerHeight) * 2 + 1;
}
renderer.domElement.addEventListener('pointermove', (e) => {
  setPointer(e);
  raycaster.setFromCamera(pointer, camera);
  const hit = raycaster.intersectObjects(interactive, false)[0];
  const obj = hit ? hit.object : null;
  if (hovered && hovered !== obj) hovered.material.emissive.setHex(0x000000);
  hovered = obj;
  if (hovered) hovered.material.emissive.setHex(0x222222);
  renderer.domElement.style.cursor = hovered ? 'pointer' : 'grab';
});
renderer.domElement.addEventListener('pointerdown', (e) => {
  setPointer(e);
  raycaster.setFromCamera(pointer, camera);
  const hit = raycaster.intersectObjects(interactive, false)[0];
  if (hit) bounces.set(hit.object, 0);
});

// --- Loop -----------------------------------------------------------------
const clock = new THREE.Clock();
let firstFrame = true;
renderer.setAnimationLoop(() => {
  const dt = Math.min(clock.getDelta(), 0.05);
  const t = clock.elapsedTime;
  for (const mesh of interactive) {
    mesh.rotation.y += mesh.userData.spin * dt;
    let y = mesh.userData.baseY + Math.sin(t * 1.4 + mesh.position.x) * 0.12;
    if (bounces.has(mesh)) {
      const p = bounces.get(mesh) + dt * 2.4;
      if (p >= 1) bounces.delete(mesh);
      else { bounces.set(mesh, p); y += Math.sin(p * Math.PI) * 1.1; }
    }
    mesh.position.y = y;
  }
  controls.update();
  renderer.render(scene, camera);
  if (firstFrame) {
    firstFrame = false;
    document.getElementById('loading').style.display = 'none';
  }
});

// --- Resize ---------------------------------------------------------------
window.addEventListener('resize', () => {
  camera.aspect = window.innerWidth / window.innerHeight;
  camera.updateProjectionMatrix();
  renderer.setSize(window.innerWidth, window.innerHeight);
});
</script>
</body>
</html>
