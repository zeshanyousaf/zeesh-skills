  rationale: On 2026-10-17 the same site-safety configuration outage blocked Blogger Day 6, WhoaWire TikTok posts, Gumroad uploads, the Pumpkin KDP cover upload, and the Whop campaign list, while workers retried up to five times and the user repeatedly pressed to retry. The retries did not change the outcome and risked duplicate work, while the queue state needed preservation. This skill codifies the one-probe rule already stated in alignment but not followed in practice, plus queue preservation and a phone handover, which no existing skill covers per skill_search.
