  rationale: 'On 2026-11-01 a correction established that a November MH370 search restart was not confirmed, with the Ocean Infinity contract extended to 30 June 2027 for about 7,428 km2 and a November to April redeployment window with no ship or start date announced, yet the build finished at 12:43 the same day still carried the superseded resume claim in its voiceover, title and description, leaving a fix pending (title and description now, re-record of the final about 20 seconds of voiceover, package held from public release). The existing generated_video_verification skill checks faces, audio intelligibility, on-screen text, motion and framing, but never checks factual claims against a correction issued after the script was built, so it could not catch this. The new section closes exactly that gap for the queued documentary series without changing the existing face, audio and framing checks. Other window signals were checked and deliberately not proposed: the email-check rebukes repeat a rule already in memory rather than a missing method, the KDP stale-cover resubmission is already covered by kdp_cover_qa record-and-compare, the deterministic handoff-suppression and recurring-failure candidates name objective-loop cadence with no reusable method, and learned skills number below the 10-skill consolidation trigger.'
